name: Supabase (database + account manager)

# Applies supabase/migrations and deploys the org-admin Edge Function.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the project's database password
on:
  push:
    branches: [main, 'claude/**']
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lfplpizvmcgvvvvpgomv
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets to deploy the database and account manager automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Deploy the org-admin function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy org-admin --project-ref "$PROJECT_REF"
