name: Build apps

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a private draft release with the Mac and Windows installers
        type: boolean
        default: false
      publish_release:
        description: Publish a public release with the Mac and Windows installers
        type: boolean
        default: false

permissions:
  contents: write

# Optional: set these repository variables (Settings → Secrets and variables → Actions → Variables)
# to turn on sign-in and cloud saving. Both values are public by design; never use the
# database password or the service_role key here.
env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  # The Supabase migrations on a real PostgreSQL, plus every permission rule
  # (who can see, create, grade and share what).
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and permission tests
        run: bash tests/db/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  mac:
    needs: test
    # Apple Silicon runners are often out of capacity; the Intel runner can still build
    # the arm64 .dmg. Set the repository variable MAC_RUNNER=macos-latest to build (and
    # launch-test) on Apple Silicon instead.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .dmg (Apple Silicon)
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Install from the .dmg like a user would, then launch the app and wait for
      # the editor to report that it started. Fails the build if it doesn't.
      - name: Launch test
        if: runner.arch == 'ARM64'
        timeout-minutes: 5
        run: |
          set -e
          DMG=$(ls release/*-arm64.dmg)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          rm -rf /tmp/apps && mkdir -p /tmp/apps
          cp -R "$MNT/OpenCAD Studio.app" /tmp/apps/
          hdiutil detach "$MNT" -quiet
          APP="/tmp/apps/OpenCAD Studio.app"
          sw_vers
          codesign --verify --deep --strict --verbose=2 "$APP"
          OPENCAD_SMOKE_TEST=1 "$APP/Contents/MacOS/OpenCAD Studio" 2>&1 | tee /tmp/smoke.log
          grep -q SMOKE_OK /tmp/smoke.log
      - name: Check the .dmg (mounts, arm64, valid signature)
        run: |
          set -e
          DMG=$(ls release/*.dmg)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          APP="$MNT/OpenCAD Studio.app"
          file "$APP/Contents/MacOS/OpenCAD Studio" | tee /tmp/arch.txt
          grep -q arm64 /tmp/arch.txt
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/app.asar"
          hdiutil detach "$MNT" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCAD-Studio-macOS
          path: release/*.dmg
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer (.exe)
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Launch the unpacked app and wait for the editor to report that it started.
      - name: Launch test
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          OPENCAD_SMOKE_TEST=1 "release/win-unpacked/OpenCAD Studio.exe" > smoke.log 2>&1
          code=$?
          cat smoke.log
          echo "exit code: $code"
          test "$code" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCAD-Studio-Windows
          path: release/*.exe
          if-no-files-found: error

  # Website (Jekyll, from site/) with the browser version of the app at /app/.
  # One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build the web app
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: Share the school list with the website
        run: mkdir -p site/_data && cp src/orgs.json site/_data/orgs.json
      - name: Build the website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Put the web app at /app/, /admin/ and every school's /org/<slug>/ and /org/<slug>/student/
        run: |
          sudo cp -r dist _site/app
          for slug in $(node -p "require('./src/orgs.json').map(o => o.slug).join(' ')"); do
            sudo mkdir -p "_site/org/$slug/student"
            sudo cp -r dist/. "_site/org/$slug/"
            sudo cp -r dist/. "_site/org/$slug/student/"
          done
          # admin panel
          sudo mkdir -p _site/admin && sudo cp -r dist/. _site/admin/
          # Schools added in the app have no folder of their own: GitHub Pages serves 404.html
          # for unknown addresses, so make it the app (with absolute asset paths) and it
          # reads the school from the address /3DCAD/org/<slug>/.
          sed 's#="\./assets/#="/3DCAD/app/assets/#g; s#href="\./#href="/3DCAD/app/#g' dist/index.html | sudo tee _site/404.html > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Drafts are only visible to people with write access to the repo.
  # Publish one from the Releases page when you want it public.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release || inputs.publish_release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
          pattern: OpenCAD-Studio-*   # only the installers, not the website bundle
          merge-multiple: true
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.publish_release != true }}
          make_latest: ${{ inputs.publish_release == true }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: OpenCAD Studio ${{ steps.ver.outputs.version }}
          body: |
            Free parametric 3D CAD.

            **Mac (Apple Silicon: M1/M2/M3/M4…)** — download the `.dmg`, open it and drag the app into Applications.
            The first time, macOS may block it: open **System Settings → Privacy & Security** and click **Open Anyway**,
            or run `xattr -cr "/Applications/OpenCAD Studio.app"` in Terminal.

            **Windows 10/11** — download `OpenCAD Studio Setup ….exe` and run it. If Windows shows
            "Windows protected your PC", click **More info → Run anyway**.
          files: dist-files/*
